name: Render JS sites for QuickTracker

on:
  # Runs automatically on this schedule. GitHub times are always UTC.
  # 5 minutes is the shortest interval GitHub's free scheduler allows
  # at all — and even at 5 minutes, GitHub only promises "best effort":
  # a run can start late during busy periods on their infrastructure,
  # so treat this as a fallback for the handful of JS-heavy sites, not
  # a guaranteed-punctual replacement for the normal 1-minute cron.
  schedule:
    - cron: "*/5 * * * *"

  # Lets you click "Run workflow" on the Actions tab to trigger it
  # manually any time — handy for testing without waiting.
  workflow_dispatch:

# If a run is ever still going when the next 5-minute mark arrives
# (a slow site, GitHub itself running behind), this waits for it to
# finish rather than starting a second one on top of it.
concurrency:
  group: quicktracker-js-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Cache the headless browser between runs
        # Re-downloading Chromium from scratch every single run (the
        # default) takes 30-60 seconds on its own — at a 5-minute
        # schedule that's real overhead, and risks one run still
        # downloading when the next one is due to start. Caching the
        # browser here means every run after the first just reuses it.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the headless browser
        run: npx playwright install --with-deps chromium

      - name: Render sites and push to QuickTracker
        env:
          QT_BASE_URL: ${{ secrets.QT_BASE_URL }}
          QT_RENDER_SECRET: ${{ secrets.QT_RENDER_SECRET }}
        run: node render.js
